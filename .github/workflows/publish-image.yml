name: Publish Frontend Image

on:
  push:
    branches: [production]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-ops-front-end:production
            ghcr.io/${{ github.repository_owner }}/smart-ops-front-end:${{ github.sha }}

  trigger-ec2-deploy:
    name: Trigger EC2 deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Start the production deploy in smart-ops-infrastructure
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::INFRA_DEPLOY_TOKEN is not set, so the EC2 deploy was not started. Run 'Deploy Production to EC2' in smart-ops-infrastructure by hand."
            exit 0
          fi
          gh workflow run deploy-production-ec2.yml \
            --repo ${{ github.repository_owner }}/smart-ops-infrastructure \
            --ref production \
            -f service=front-end \
            -f image_tag=${{ github.sha }}
          echo "✅ EC2 deploy requested for front-end (${{ github.sha }})"
